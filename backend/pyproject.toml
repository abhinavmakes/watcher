[project]
name = "watcher-backend"
version = "0.1.0"
description = "FastAPI API and ingestion worker for Watcher."
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.1",
    "feedparser>=6.0.12",
    "google-genai>=2.3.0",
    "httpx>=0.28.1",
    "litellm>=1.84.0",
    "numpy>=2.4.5",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.97.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "structlog>=25.5.0",
    "supabase>=2.30.0",
    "tenacity>=9.1.4",
]

[project.scripts]
watcher-worker = "worker.run:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
