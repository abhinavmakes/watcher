[project]
name = "watcher-backend"
version = "0.1.0"
description = "FastAPI API and ingestion worker for Watcher."
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.136.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic,openai]>=1.97.0",
    "pydantic-settings>=2.14.1",
    "slowapi>=0.1.10",
    "supabase>=2.30.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
# A local supabase/ CLI directory would otherwise make ruff treat the package as first-party.
known-third-party = ["supabase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
