name: Ingest

on:
  schedule:
    - cron: "0 6 */2 * *" # every ~2 days, 06:00 UTC
  workflow_dispatch: # manual trigger — used for live demos

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1" # stream logs live instead of buffering to the end
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
        run: uv run python -m worker.run
